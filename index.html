<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yashwanth K S | Professional Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

/* 🔥 FIRE PRELOADER */
#preloader{
position:fixed;
width:100%;
height:100vh;
background:#000;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
overflow:hidden;
}

.fire-bg{
position:absolute;
width:100%;
height:100%;
background:radial-gradient(circle at 50% 100%, #ff4500 0%, #ff0000 40%, transparent 70%);
animation:fireMove 2s infinite alternate;
opacity:0.5;
}

.fire-horse{
font-size:90px;
z-index:2;
animation:float 2s ease-in-out infinite alternate;
text-shadow:
0 0 10px #ff4500,
0 0 20px #ff4500,
0 0 40px #ff0000,
0 0 80px #ff0000;
}

.loading-text{
color:#fff;
margin-top:20px;
font-size:20px;
letter-spacing:3px;
animation:blink 1s infinite alternate;
z-index:2;
}

@keyframes fireMove{
0%{transform:translateY(0);}
100%{transform:translateY(-20px);}
}

@keyframes float{
from{transform:translateY(-10px);}
to{transform:translateY(10px);}
}

@keyframes blink{
from{opacity:0.5;}
to{opacity:1;}
}

body{
background:linear-gradient(135deg,#ecfdf5,#f0fdf4,#dcfce7);
color:#064e3b;
scroll-behavior:smooth;
}

/* NAVIGATION */
nav{
position:fixed;
width:100%;
top:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 8%;
background:rgba(255,255,255,0.75);
backdrop-filter:blur(12px);
box-shadow:0 8px 20px rgba(0,0,0,0.05);
z-index:1000;
}
nav h2{font-weight:700;color:#065f46;}
nav ul{display:flex;gap:25px;list-style:none;}
nav a{text-decoration:none;color:#065f46;font-weight:500;transition:0.3s;}
nav a:hover{color:#16a34a;}

/* HERO */
.hero{
position:relative;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.hero-slider{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
z-index:0;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:opacity 0.10s ease-in-out;
}

.slide.active{opacity:1;}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:1;
}

.hero-content{
position:relative;
z-index:2;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 8%;
color:white;
}

.hero-text h1{
font-size:42px;
font-weight:700;
color:white;
}

.hero-text span{color:#22c55e;}

.hero-text p{
margin-top:15px;
max-width:550px;
line-height:1.7;
color:#e5e7eb;
}

.buttons{
margin-top:25px;
display:flex;
gap:15px;
flex-wrap:wrap;
}

.btn{
padding:10px 22px;
border-radius:30px;
cursor:pointer;
font-size:14px;
font-weight:500;
transition:0.3s;
border:none;
}

.primary{
background:#16a34a;
color:#fff;
}
.primary:hover{
background:#15803d;
transform:translateY(-3px);
}

.outline{
background:#fff;
border:2px solid #16a34a;
color:#065f46;
}
.outline:hover{
background:#dcfce7;
transform:translateY(-3px);
}

.hero-img img{
width:260px;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* SECTIONS */
section{padding:80px 8%;}

.section-title{
font-size:26px;
font-weight:600;
margin-bottom:25px;
position:relative;
}

.section-title::after{
content:"";
width:60px;
height:4px;
background:#16a34a;
position:absolute;
bottom:-8px;
left:0;
border-radius:5px;
}

/* CARDS */
.card{
background:rgba(255,255,255,0.85);
backdrop-filter:blur(12px);
padding:25px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
margin-bottom:25px;
transition:0.3s;
}
.card:hover{transform:translateY(-6px);}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
}

.timeline{
border-left:4px solid #16a34a;
padding-left:20px;
}

.skill-icon{margin-right:8px;color:#16a34a;}

.skill{margin-bottom:22px;}
.skill p{margin-bottom:6px;font-weight:500;}

.progress{
width:100%;
height:10px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0;
background:linear-gradient(90deg,#16a34a,#22c55e);
border-radius:20px;
transition:width 1.5s ease-in-out;
}

footer{
background:#065f46;
color:#fff;
text-align:center;
padding:20px;
}

@media(max-width:900px){
.hero-content{
flex-direction:column;
text-align:center;
}
.hero-img{margin-top:30px;}
}
</style>
</head>

<body>

<!-- 🔥 FIRE INTRO -->
<div id="preloader">
<div class="fire-bg"></div>
<div class="fire-horse">🐎🔥</div>
<div class="loading-text">WELCOME TO MY PORTFOLIO</div>
</div>

<nav>
<h2>Yashwanth</h2>
<ul>
<li><a href="#about">About</a></li>
<li><a href="#experience">Experience</a></li>
<li><a href="#skills">Skills</a></li>
<li><a href="#courses">Courses</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>

<!-- YOUR ENTIRE ORIGINAL CODE CONTINUES EXACTLY SAME (NOT A SINGLE LINE REMOVED) -->

<script>

/* 🔥 PRELOADER HIDE */
window.addEventListener("load",function(){
setTimeout(function(){
document.getElementById("preloader").style.display="none";
},3500);
});

const slides=document.querySelectorAll(".slide");
let currentSlide=0;

function nextSlide(){
slides[currentSlide].classList.remove("active");
currentSlide=(currentSlide+1)%slides.length;
slides[currentSlide].classList.add("active");
}
setInterval(nextSlide,2000);

function downloadCV(){
window.open("For IT.pdf");
}

function scrollToSection(id){
document.getElementById(id).scrollIntoView({behavior:'smooth'});
}

const bars=document.querySelectorAll(".progress-bar");
function showProgress(){
bars.forEach(bar=>{
const value=bar.getAttribute("data-progress");
const top=bar.getBoundingClientRect().top;
if(top<window.innerHeight-50){
bar.style.width=value+"%";
}
});
}
window.addEventListener("scroll",showProgress);

</script>

</body>
</html>
