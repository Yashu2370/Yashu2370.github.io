<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yashwanth K S — Professional Portfolio</title>
<meta name="description" content="Assistant Librarian & Digital Resource Specialist Portfolio" />

<style>

/* ===============================
   Corporate SaaS Theme (Bitdeer style)
   =============================== */

:root{
  --primary:#22C58B;
  --primary-light:#2DD4A3;
  --primary-dark:#1EA97A;

  --accent:#F59E0B;
  --accent-dark:#F97316;

  --bg:#F8FAFC;
  --panel:#FFFFFF;
  --muted:#6B7280;
  --text:#111827;

  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,0.06);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

.wrap{max-width:1200px;margin:30px auto;padding:20px}

header{
  background:#111827;
  color:white;
  padding:14px 20px;
  border-radius:12px;
  position:sticky;
  top:15px;
  z-index:100;
}

.nav{display:flex;justify-content:space-between;align-items:center}
nav ul{display:flex;gap:15px;list-style:none}
nav a{
  color:#D1D5DB;
  text-decoration:none;
  font-weight:600;
  padding:8px 12px;
  border-radius:8px;
  transition:.2s;
}
nav a:hover{
  background:rgba(255,255,255,0.1);
  color:white;
}

.brand .logo{
  background:var(--primary);
  color:white;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
}

.search{
  padding:8px 10px;
  border-radius:8px;
  border:1px solid #E5E7EB;
}

.btn{
  padding:10px 14px;
  border-radius:8px;
  font-weight:600;
  border:none;
  cursor:pointer;
  transition:.2s;
}

.btn.neon{
  background:var(--primary);
  color:white;
}
.btn.neon:hover{
  background:var(--primary-dark);
}

.btn.ghost{
  background:white;
  border:1px solid #E5E7EB;
}
.btn.ghost:hover{
  background:#F3F4F6;
}

.hero{
  background:white;
  border-radius:14px;
  padding:40px;
  margin-top:20px;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:1fr 400px;
  gap:40px;
}

.hero h2{
  font-size:38px;
}

.photo-frame{
  border-radius:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.card{
  background:var(--panel);
  border-radius:14px;
  padding:25px;
  margin-top:20px;
  box-shadow:var(--shadow);
}

.projects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.project{
  border:1px solid #E5E7EB;
  padding:15px;
  border-radius:12px;
}

.pill{
  background:rgba(34,197,139,0.1);
  color:var(--primary-dark);
  padding:6px 12px;
  border-radius:50px;
  font-weight:600;
  display:inline-block;
  margin:5px 5px 0 0;
}

.progress{
  height:8px;
  background:#E5E7EB;
  border-radius:50px;
  overflow:hidden;
}
.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--primary-light));
}

footer{
  margin-top:40px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

/* responsive */
@media(max-width:900px){
  .hero{grid-template-columns:1fr}
}

</style>
</head>
