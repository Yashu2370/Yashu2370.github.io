<!DOCTYPE html>
<html lang="en">

<head>

  <!-- ===== BASIC ===== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yashwanth K S | Professional Portfolio</title>
  <meta name="google-site-verification" content="wIn61JhAgK5yjdifmPMS9aO0FLIP_IijbvH-M6IGKUM" />

  <!-- ===== SEO ===== -->
  <meta name="description" content="Yashwanth K S Portfolio - Library & IT professional specializing in LMS, SQL analytics, and digital systems.">
  <meta name="keywords" content="Yashwanth K S, Library Science, Portfolio, SQL, Koha, DSpace, Web Developer">
  <meta name="author" content="Yashwanth K S">

  <!-- ===== SOCIAL ===== -->
  <meta property="og:title" content="Yashwanth K S | Portfolio">
  <meta property="og:description" content="Professional portfolio showcasing skills, projects, and experience.">
  <meta property="og:image" content="preview.png">

  <!-- ===== UI ===== -->
  <meta name="theme-color" content="#064e3b">

  <!-- ===== FONTS & ICONS ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- ===== STYLES ===== -->
  <style>

  :root{
    --primary:#16a34a;
    --secondary:#22c55e;
    --dark:#064e3b;
  }

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
  }

  body{
    background:linear-gradient(135deg,#ecfdf5,#f0fdf4,#dcfce7);
    color:#064e3b;
    scroll-behavior:smooth;
    overflow-x:hidden;
  }

  /* PRELOADER */
  #preloader{
    position:fixed;
    width:100%;
    height:100vh;
    background:#064e3b;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
  }

  .loader{
    width:60px;
    height:60px;
    border:6px solid #22c55e;
    border-top:6px solid transparent;
    border-radius:50%;
    animation:spin 1s linear infinite;
  }

  @keyframes spin{100%{transform:rotate(360deg);}}

  /* SCROLL BAR */
  #progressBar{
    position:fixed;
    top:0;
    left:0;
    height:4px;
    background:linear-gradient(90deg,#16a34a,#22c55e);
    width:0%;
    z-index:2000;
  }

  /* CURSOR */
  .cursor-glow{
    position:fixed;
    width:18px;
    height:18px;
    background:rgba(34,197,94,0.6);
    border-radius:50%;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:3000;
  }

  /* NAV */
  nav{
    position:fixed;
    width:100%;
    top:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 8%;
    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(10px);
    z-index:1000;
  }

  nav ul{
    display:flex;
    gap:20px;
    list-style:none;
  }

  nav a{
    text-decoration:none;
    color:#065f46;
  }

  nav a:hover{color:#16a34a;}

  /* HERO */
  .hero{
    position:relative;
    height:70vh;
    display:flex;
    align-items:center;
  }

  .hero-video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
  }

  .hero-content{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:space-between;
    padding:0 8%;
    color:white;
    width:100%;
  }

  .hero-text span{color:#22c55e;}

  .btn{
    padding:10px 20px;
    border-radius:30px;
    cursor:pointer;
  }

  .primary{background:#16a34a;color:white;}
  .outline{border:2px solid #16a34a;background:white;}

  .card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
  }

  section{padding:20px 8%;}

  .footer{
    text-align:center;
    background:#0f172a;
    color:white;
    padding:20px;
  }

  body.dark{
    background:#0f172a;
    color:white;
  }

  </style>

</head>

<body>

<button id="topBtn"
style="position:fixed;bottom:30px;right:30px;padding:12px;border:none;border-radius:50%;background:#16a34a;color:white;font-size:18px;cursor:pointer;display:none;z-index:2000;">
<i class="fa-solid fa-arrow-up"></i>
</button>

<div id="preloader"><div class="loader"></div></div>
<div id="progressBar"></div>
<div class="cursor-glow"></div>

<nav>
<button onclick="document.body.classList.toggle('dark')" style="padding:6px 14px;border:none;border-radius:20px;background:#16a34a;color:white;">🌙</button>
<h2>Yashwanth</h2>
<ul>
<li><a href="#about">About</a></li>
<li><a href="#experience">Experience</a></li>
<li><a href="#skills">Skills</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>

<div class="hero">
<video class="hero-video" autoplay muted loop>
<source src="1.mp4">
</video>
<div class="overlay"></div>

<div class="hero-content">
<div class="hero-text">
<h1>Hello, I'm <span>Yashwanth K S</span></h1>
<p></p>

<button class="btn primary" onclick="window.open('For IT.pdf')">Download CV</button>
</div>

<div class="hero-img">
<img src="profile.jpg" width="250">
</div>
</div>
</div>

<section id="about">
<h2>Career Objective</h2>
<div class="card">
Library & IT professional specializing in digital systems and analytics.
</div>
</section>

<footer class="footer">
© 2026 Yashwanth K S
</footer>

<script>

const preloader=document.getElementById("preloader");
window.addEventListener("load",()=>{preloader.style.display="none";});

const topBtn=document.getElementById("topBtn");

window.addEventListener("scroll",()=>{
topBtn.style.display=window.scrollY>300?"block":"none";
});

topBtn.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

document.addEventListener("mousemove",(e)=>{
document.querySelector(".cursor-glow").style.left=e.pageX+"px";
document.querySelector(".cursor-glow").style.top=e.pageY+"px";
});

</script>

</body>
</html>
